{% extends 'base.html' %}
{% block title %}{{ title }} — Контур CRM{% endblock %}
{% block content %}
<header class="page-head">
  <p class="eyebrow"><a href="{% url 'crm:task_list' %}">← Задачи</a></p>
  <h1>{{ title }}</h1>
</header>
<form method="post" class="form-card">
  {% csrf_token %}
  {% for field in form %}
  <div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <button type="submit" class="btn">Сохранить</button>
</form>
{% endblock %}
